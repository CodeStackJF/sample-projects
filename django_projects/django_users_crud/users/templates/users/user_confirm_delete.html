{% extends "base.html" %}
{% block title %}Eliminar usuario{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="mb-3">Eliminar usuario</h3>
            <p>
                ¿Seguro que deseas eliminar a
                <strong>{{ user_obj.full_name }}</strong> ({{ user_obj.email }})?
                Esta acción no se puede deshacer.
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'user_detail' user_obj.pk %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
