{% extends 'base.html' %}

{% block content %}
    <div class="row">
        <div class="col-md-7">
            <div class="card" style="padding: 10px">
                <form method="post">
                    {% csrf_token %} 
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">{{form.first_name.label}}</label>
                            {{form.first_name}}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">{{form.last_name.label}}</label>
                            {{form.last_name}}
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">{{form.email.label}}</label>
                            {{form.email}}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">{{form.phone_number.label}}</label>
                            {{form.phone_number}}
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3">
                            <button type="submit" class="btn-primary btn">Save</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
