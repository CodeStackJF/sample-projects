{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CRUD Users{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f6fa; }
        .navbar-brand { font-weight: 600; }
        .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .table thead { background-color: #212529; color: #fff; }
        .badge-active { background-color: #198754; }
        .badge-inactive { background-color: #6c757d; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
           
            <div class="d-flex align-items-center">
                    <a href="{% url 'user_list' %}" class="btn btn-outline-light btn-sm me-2">Usuarios</a>

            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
